version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: interview_platform_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: interview_platform
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: interview_platform_server
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/interview_platform
      JWT_SECRET: change_me_in_production
      JWT_REFRESH_SECRET: change_refresh_me_in_production
      CLIENT_URL: http://localhost:5173
    ports:
      - '5000:5000'
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
