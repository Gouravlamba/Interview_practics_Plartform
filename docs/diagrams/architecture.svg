<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="580" fill="#070B14" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" fill="#50E6FF" font-size="20" font-weight="bold" letter-spacing="1">Interview Practice Platform — Architecture</text>

  <!-- ─────────────── CLIENT LAYER ─────────────── -->
  <rect x="30" y="65" width="220" height="440" rx="10" fill="#0E1424" stroke="#2F80FF" stroke-width="1.5"/>
  <text x="140" y="88" text-anchor="middle" fill="#2F80FF" font-size="13" font-weight="bold">CLIENT (Browser)</text>

  <!-- React/Vite box -->
  <rect x="50" y="98" width="180" height="50" rx="6" fill="#131C30" stroke="#2F80FF" stroke-width="1"/>
  <text x="140" y="118" text-anchor="middle" fill="#A8BFFF" font-size="11" font-weight="bold">React 18 + Vite</text>
  <text x="140" y="134" text-anchor="middle" fill="#6B8AC0" font-size="10">SPA • React Router v6</text>

  <!-- Tailwind/Framer -->
  <rect x="50" y="160" width="180" height="50" rx="6" fill="#131C30" stroke="#2F80FF" stroke-width="1"/>
  <text x="140" y="180" text-anchor="middle" fill="#A8BFFF" font-size="11" font-weight="bold">Tailwind CSS + Framer Motion</text>
  <text x="140" y="196" text-anchor="middle" fill="#6B8AC0" font-size="10">Styling • Animations</text>

  <!-- Recharts -->
  <rect x="50" y="222" width="180" height="50" rx="6" fill="#131C30" stroke="#A855F7" stroke-width="1"/>
  <text x="140" y="242" text-anchor="middle" fill="#C7A0FF" font-size="11" font-weight="bold">Recharts</text>
  <text x="140" y="258" text-anchor="middle" fill="#8B6DB0" font-size="10">Analytics / Radar / Trend</text>

  <!-- Axios + Socket.IO -->
  <rect x="50" y="284" width="180" height="50" rx="6" fill="#131C30" stroke="#50E6FF" stroke-width="1"/>
  <text x="140" y="304" text-anchor="middle" fill="#8DE8FF" font-size="11" font-weight="bold">Axios + Socket.IO Client</text>
  <text x="140" y="320" text-anchor="middle" fill="#5BABBF" font-size="10">HTTP • WebSocket</text>

  <!-- Pages -->
  <rect x="50" y="346" width="180" height="130" rx="6" fill="#101828" stroke="#2F80FF" stroke-width="0.8"/>
  <text x="140" y="364" text-anchor="middle" fill="#7B9FCC" font-size="10" font-weight="bold">Pages</text>
  <text x="65" y="382" fill="#6B8AC0" font-size="9">• Landing / Marketing</text>
  <text x="65" y="397" fill="#6B8AC0" font-size="9">• Login / Register</text>
  <text x="65" y="412" fill="#6B8AC0" font-size="9">• Dashboard</text>
  <text x="65" y="427" fill="#6B8AC0" font-size="9">• Interview Setup</text>
  <text x="65" y="442" fill="#6B8AC0" font-size="9">• Live Interview</text>
  <text x="65" y="457" fill="#6B8AC0" font-size="9">• Performance Analytics</text>

  <!-- ─────────────── ARROW CLIENT → SERVER ─────────────── -->
  <!-- HTTP REST -->
  <line x1="250" y1="225" x2="340" y2="225" stroke="#2F80FF" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="295" y="218" text-anchor="middle" fill="#2F80FF" font-size="9">REST API</text>
  <!-- WebSocket -->
  <line x1="250" y1="280" x2="340" y2="280" stroke="#50E6FF" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-cyan)"/>
  <text x="295" y="273" text-anchor="middle" fill="#50E6FF" font-size="9">WebSocket</text>

  <!-- ─────────────── SERVER LAYER ─────────────── -->
  <rect x="340" y="65" width="220" height="440" rx="10" fill="#0E1424" stroke="#50E6FF" stroke-width="1.5"/>
  <text x="450" y="88" text-anchor="middle" fill="#50E6FF" font-size="13" font-weight="bold">BACKEND (Node.js)</text>

  <!-- Express -->
  <rect x="358" y="98" width="184" height="50" rx="6" fill="#131C30" stroke="#50E6FF" stroke-width="1"/>
  <text x="450" y="118" text-anchor="middle" fill="#8DE8FF" font-size="11" font-weight="bold">Express 4 + Helmet</text>
  <text x="450" y="134" text-anchor="middle" fill="#5BABBF" font-size="10">CORS • Rate Limiting • Morgan</text>

  <!-- Socket.IO -->
  <rect x="358" y="160" width="184" height="50" rx="6" fill="#131C30" stroke="#50E6FF" stroke-width="1"/>
  <text x="450" y="180" text-anchor="middle" fill="#8DE8FF" font-size="11" font-weight="bold">Socket.IO Server</text>
  <text x="450" y="196" text-anchor="middle" fill="#5BABBF" font-size="10">Real-time Chat • Code Sync</text>

  <!-- Auth -->
  <rect x="358" y="222" width="184" height="50" rx="6" fill="#131C30" stroke="#A855F7" stroke-width="1"/>
  <text x="450" y="242" text-anchor="middle" fill="#C7A0FF" font-size="11" font-weight="bold">JWT Auth Middleware</text>
  <text x="450" y="258" text-anchor="middle" fill="#8B6DB0" font-size="10">Access (15m) + Refresh (7d)</text>

  <!-- API Routes -->
  <rect x="358" y="284" width="184" height="130" rx="6" fill="#101828" stroke="#50E6FF" stroke-width="0.8"/>
  <text x="450" y="302" text-anchor="middle" fill="#7BCFCC" font-size="10" font-weight="bold">API Routes</text>
  <text x="373" y="320" fill="#5BABBF" font-size="9">• /api/auth</text>
  <text x="373" y="335" fill="#5BABBF" font-size="9">• /api/users  /api/roles</text>
  <text x="373" y="350" fill="#5BABBF" font-size="9">• /api/sessions</text>
  <text x="373" y="365" fill="#5BABBF" font-size="9">• /api/analytics</text>
  <text x="373" y="380" fill="#5BABBF" font-size="9">• /api/files  /api/ai</text>
  <text x="373" y="395" fill="#5BABBF" font-size="9">• /api-docs (Swagger)</text>

  <!-- Swagger -->
  <rect x="358" y="426" width="184" height="50" rx="6" fill="#131C30" stroke="#2F80FF" stroke-width="1"/>
  <text x="450" y="446" text-anchor="middle" fill="#A8BFFF" font-size="11" font-weight="bold">Swagger UI</text>
  <text x="450" y="462" text-anchor="middle" fill="#6B8AC0" font-size="10">OpenAPI 3 Documentation</text>

  <!-- ─────────────── ARROW SERVER → AI ─────────────── -->
  <line x1="560" y1="200" x2="640" y2="200" stroke="#A855F7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="600" y="193" text-anchor="middle" fill="#A855F7" font-size="9">HTTPS</text>

  <!-- ─────────────── AI LAYER ─────────────── -->
  <rect x="640" y="65" width="220" height="185" rx="10" fill="#0E1424" stroke="#A855F7" stroke-width="1.5"/>
  <text x="750" y="88" text-anchor="middle" fill="#A855F7" font-size="13" font-weight="bold">AI SERVICE</text>

  <!-- OpenAI -->
  <rect x="658" y="98" width="184" height="50" rx="6" fill="#131C30" stroke="#A855F7" stroke-width="1"/>
  <text x="750" y="118" text-anchor="middle" fill="#C7A0FF" font-size="11" font-weight="bold">OpenAI GPT-3.5-turbo</text>
  <text x="750" y="134" text-anchor="middle" fill="#8B6DB0" font-size="10">Interview Q&amp;A • Feedback</text>

  <!-- Mock Fallback -->
  <rect x="658" y="160" width="184" height="50" rx="6" fill="#131C30" stroke="#A855F7" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="750" y="180" text-anchor="middle" fill="#C7A0FF" font-size="11" font-weight="bold">Mock Fallback</text>
  <text x="750" y="196" text-anchor="middle" fill="#8B6DB0" font-size="10">Works without API key</text>

  <!-- ─────────────── ARROW SERVER → DB ─────────────── -->
  <line x1="560" y1="360" x2="640" y2="360" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="600" y="353" text-anchor="middle" fill="#F59E0B" font-size="9">Mongoose ODM</text>

  <!-- ─────────────── DB LAYER ─────────────── -->
  <rect x="640" y="295" width="220" height="210" rx="10" fill="#0E1424" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="750" y="318" text-anchor="middle" fill="#F59E0B" font-size="13" font-weight="bold">DATABASE</text>

  <!-- MongoDB -->
  <rect x="658" y="328" width="184" height="50" rx="6" fill="#131C30" stroke="#F59E0B" stroke-width="1"/>
  <text x="750" y="348" text-anchor="middle" fill="#FCD28A" font-size="11" font-weight="bold">MongoDB 7.0</text>
  <text x="750" y="364" text-anchor="middle" fill="#B08040" font-size="10">Hosted / Docker Container</text>

  <!-- Collections -->
  <rect x="658" y="390" width="184" height="100" rx="6" fill="#101828" stroke="#F59E0B" stroke-width="0.8"/>
  <text x="750" y="408" text-anchor="middle" fill="#B08040" font-size="10" font-weight="bold">Collections</text>
  <text x="673" y="426" fill="#9B7030" font-size="9">• users</text>
  <text x="673" y="441" fill="#9B7030" font-size="9">• interviewsessions</text>
  <text x="673" y="456" fill="#9B7030" font-size="9">• questions  • roles</text>
  <text x="673" y="471" fill="#9B7030" font-size="9">• uploadedfiles</text>

  <!-- ─────────────── DOCKER LAYER ─────────────── -->
  <rect x="30" y="520" width="840" height="40" rx="8" fill="#0A1020" stroke="#2F80FF" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="450" y="535" text-anchor="middle" fill="#2F80FF" font-size="10" font-weight="bold">Docker / Docker Compose</text>
  <text x="450" y="551" text-anchor="middle" fill="#3A5080" font-size="9">mongodb container  •  backend container (port 5000)  •  frontend (port 5173)  •  bridge network: app-network</text>

  <!-- ─────────────── ARROWHEAD DEFS ─────────────── -->
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2F80FF"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#50E6FF"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#A855F7"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F59E0B"/>
    </marker>
  </defs>
</svg>
