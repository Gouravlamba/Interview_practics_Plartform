<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 760" width="820" height="760" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="820" height="760" fill="#070B14" rx="12"/>

  <!-- Title -->
  <text x="410" y="36" text-anchor="middle" fill="#50E6FF" font-size="18" font-weight="bold" letter-spacing="1">Interview Session — Flow Diagram</text>

  <!-- ─── DEFS: arrows ─── -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2F80FF"/>
    </marker>
    <marker id="arr-cyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#50E6FF"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#A855F7"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10B981"/>
    </marker>
  </defs>

  <!-- ──────────────────────────────────────────
       STEP 1: Register / Login
  ─────────────────────────────────────────── -->
  <rect x="300" y="60" width="220" height="56" rx="28" fill="#0E1424" stroke="#2F80FF" stroke-width="2"/>
  <text x="410" y="85" text-anchor="middle" fill="#A8BFFF" font-size="13" font-weight="bold">1. Register / Login</text>
  <text x="410" y="103" text-anchor="middle" fill="#6B8AC0" font-size="10">POST /api/auth/register  or  /login</text>

  <!-- Arrow 1 → 2 -->
  <line x1="410" y1="116" x2="410" y2="155" stroke="#2F80FF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="420" y="139" fill="#2F80FF" font-size="9">JWT tokens issued</text>

  <!-- ──────────────────────────────────────────
       STEP 2: Interview Setup
  ─────────────────────────────────────────── -->
  <rect x="300" y="155" width="220" height="56" rx="28" fill="#0E1424" stroke="#2F80FF" stroke-width="2"/>
  <text x="410" y="180" text-anchor="middle" fill="#A8BFFF" font-size="13" font-weight="bold">2. Interview Setup</text>
  <text x="410" y="198" text-anchor="middle" fill="#6B8AC0" font-size="10">Select role • difficulty • upload file</text>

  <!-- Arrow 2 → 3 -->
  <line x1="410" y1="211" x2="410" y2="250" stroke="#2F80FF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="420" y="234" fill="#2F80FF" font-size="9">Config stored in context</text>

  <!-- ──────────────────────────────────────────
       STEP 3: Start Session
  ─────────────────────────────────────────── -->
  <rect x="300" y="250" width="220" height="56" rx="28" fill="#0E1424" stroke="#50E6FF" stroke-width="2"/>
  <text x="410" y="275" text-anchor="middle" fill="#8DE8FF" font-size="13" font-weight="bold">3. Start Session</text>
  <text x="410" y="293" text-anchor="middle" fill="#5BABBF" font-size="10">POST /api/sessions • Socket join-room</text>

  <!-- Arrow 3 → 4 -->
  <line x1="410" y1="306" x2="410" y2="345" stroke="#50E6FF" stroke-width="1.5" marker-end="url(#arr-cyan)"/>
  <text x="420" y="329" fill="#50E6FF" font-size="9">session-id created</text>

  <!-- ──────────────────────────────────────────
       STEP 4: Live Interview Loop
  ─────────────────────────────────────────── -->
  <!-- big loop box -->
  <rect x="60" y="345" width="700" height="220" rx="10" fill="#0A1020" stroke="#50E6FF" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="110" y="365" fill="#50E6FF" font-size="11" font-weight="bold">Live Interview Loop</text>

  <!-- 4a: User sends message -->
  <rect x="80" y="380" width="170" height="50" rx="8" fill="#0E1424" stroke="#2F80FF" stroke-width="1.5"/>
  <text x="165" y="402" text-anchor="middle" fill="#A8BFFF" font-size="11" font-weight="bold">4a. User Message</text>
  <text x="165" y="418" text-anchor="middle" fill="#6B8AC0" font-size="9">Socket: send-message</text>

  <!-- 4a → 4b -->
  <line x1="250" y1="405" x2="295" y2="405" stroke="#2F80FF" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 4b: AI Processing -->
  <rect x="295" y="380" width="170" height="50" rx="8" fill="#0E1424" stroke="#A855F7" stroke-width="1.5"/>
  <text x="380" y="402" text-anchor="middle" fill="#C7A0FF" font-size="11" font-weight="bold">4b. AI Processing</text>
  <text x="380" y="418" text-anchor="middle" fill="#8B6DB0" font-size="9">Socket: request-ai-response</text>

  <!-- 4b → 4c -->
  <line x1="465" y1="405" x2="510" y2="405" stroke="#A855F7" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- 4c: AI Response -->
  <rect x="510" y="380" width="170" height="50" rx="8" fill="#0E1424" stroke="#A855F7" stroke-width="1.5"/>
  <text x="595" y="402" text-anchor="middle" fill="#C7A0FF" font-size="11" font-weight="bold">4c. AI Response</text>
  <text x="595" y="418" text-anchor="middle" fill="#8B6DB0" font-size="9">Socket: ai-response (streamed)</text>

  <!-- 4d: Code Editor Sync -->
  <rect x="80" y="458" width="170" height="50" rx="8" fill="#0E1424" stroke="#50E6FF" stroke-width="1.5"/>
  <text x="165" y="480" text-anchor="middle" fill="#8DE8FF" font-size="11" font-weight="bold">4d. Code Editor</text>
  <text x="165" y="496" text-anchor="middle" fill="#5BABBF" font-size="9">Socket: code-change (sync)</text>

  <!-- 4e: Chat History -->
  <rect x="295" y="458" width="170" height="50" rx="8" fill="#0E1424" stroke="#2F80FF" stroke-width="1.5"/>
  <text x="380" y="480" text-anchor="middle" fill="#A8BFFF" font-size="11" font-weight="bold">4e. Chat History</text>
  <text x="380" y="496" text-anchor="middle" fill="#6B8AC0" font-size="9">Persisted in MongoDB</text>

  <!-- 4f: User leaves -->
  <rect x="510" y="458" width="170" height="50" rx="8" fill="#0E1424" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="595" y="480" text-anchor="middle" fill="#FCD28A" font-size="11" font-weight="bold">4f. End Session</text>
  <text x="595" y="496" text-anchor="middle" fill="#B08040" font-size="9">Socket: leave-room</text>

  <!-- Arrow loop box → step 5 -->
  <line x1="410" y1="565" x2="410" y2="600" stroke="#50E6FF" stroke-width="1.5" marker-end="url(#arr-cyan)"/>
  <text x="420" y="587" fill="#50E6FF" font-size="9">session ended</text>

  <!-- ──────────────────────────────────────────
       STEP 5: Analytics & Feedback
  ─────────────────────────────────────────── -->
  <rect x="300" y="600" width="220" height="56" rx="28" fill="#0E1424" stroke="#A855F7" stroke-width="2"/>
  <text x="410" y="625" text-anchor="middle" fill="#C7A0FF" font-size="13" font-weight="bold">5. Analytics &amp; Feedback</text>
  <text x="410" y="643" text-anchor="middle" fill="#8B6DB0" font-size="10">GET /api/analytics  •  radar / trends</text>

  <!-- Arrow 5 → 6 -->
  <line x1="410" y1="656" x2="410" y2="695" stroke="#A855F7" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="420" y="679" fill="#A855F7" font-size="9">scores computed</text>

  <!-- ──────────────────────────────────────────
       STEP 6: Review Performance
  ─────────────────────────────────────────── -->
  <rect x="300" y="695" width="220" height="45" rx="22" fill="#0E1424" stroke="#10B981" stroke-width="2"/>
  <text x="410" y="715" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="bold">6. Review Performance</text>
  <text x="410" y="731" text-anchor="middle" fill="#3D9E72" font-size="10">PerformancePage • charts • history</text>

  <!-- ─── Side legend ─── -->
  <rect x="660" y="620" width="140" height="110" rx="8" fill="#0A1020" stroke="#2F80FF" stroke-width="0.8"/>
  <text x="730" y="638" text-anchor="middle" fill="#6B8AC0" font-size="10" font-weight="bold">Legend</text>
  <line x1="675" y1="652" x2="700" y2="652" stroke="#2F80FF" stroke-width="2"/>
  <text x="710" y="656" fill="#6B8AC0" font-size="9">REST API</text>
  <line x1="675" y1="668" x2="700" y2="668" stroke="#50E6FF" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="710" y="672" fill="#6B8AC0" font-size="9">WebSocket</text>
  <line x1="675" y1="684" x2="700" y2="684" stroke="#A855F7" stroke-width="2"/>
  <text x="710" y="688" fill="#6B8AC0" font-size="9">AI Service</text>
  <line x1="675" y1="700" x2="700" y2="700" stroke="#10B981" stroke-width="2"/>
  <text x="710" y="704" fill="#6B8AC0" font-size="9">End State</text>
  <line x1="675" y1="716" x2="700" y2="716" stroke="#F59E0B" stroke-width="2"/>
  <text x="710" y="720" fill="#6B8AC0" font-size="9">DB Persist</text>
</svg>
